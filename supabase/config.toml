project_id = "edudrishti"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[functions.personalized-explanation]
verify_jwt = true

[functions.targeted-practice]
verify_jwt = true

[functions.check-practice-answer]
verify_jwt = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true
